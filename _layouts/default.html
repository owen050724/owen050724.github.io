<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" class="no-js">
  <head>
    {%- include head.html -%}
  </head>
  <body class="site-body">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="mobile-header">
      <button class="nav-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false" data-nav-toggle>
        <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="visually-hidden">Open navigation</span>
      </button>
      <a class="mobile-identity" href="{{ '/' | relative_url }}">Yeonoh Park</a>
    </header>

    {%- include sidebar.html -%}
    <div class="drawer-backdrop" aria-hidden="true" data-nav-close></div>

    <main class="site-main" id="main-content" tabindex="-1">
      <div class="content-shell">
        {{ content }}
        <footer class="content-footer">
          <p>Yeonoh Park · Security Researcher</p>
        </footer>
      </div>
    </main>

    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </body>
</html>
