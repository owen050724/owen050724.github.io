<aside class="site-sidebar" id="site-sidebar" aria-label="{{ ui.site_navigation }}">
  <div class="sidebar-heading">
    <a class="sidebar-identity" href="{{ localized_home | relative_url }}">
      <strong>{{ ui.name }}</strong>
      <span>{{ ui.role }}</span>
    </a>
    <button class="nav-close" type="button" data-nav-close>
      <span aria-hidden="true">×</span>
      <span class="visually-hidden">{{ ui.close_navigation }}</span>
    </button>
  </div>

  <nav class="sidebar-nav" aria-label="{{ ui.primary_navigation }}">
    {% for item in ui.navigation %}
      {% assign navigation_url = item.path | prepend: language_prefix %}
      <a href="{{ navigation_url | relative_url }}"{% if page.url == navigation_url %} class="is-active" aria-current="page"{% elsif item.path == '/vulnerabilities/' and english_url contains '/vulnerabilities/' %} class="is-active" aria-current="location"{% endif %}>{{ item.label }}</a>
    {% endfor %}
    <a class="external-link" href="https://github.com/owen050724" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
  </nav>

  <div class="sidebar-footer">
    <p>SeoulTech · CIS Lab</p>
    <div class="sidebar-contact" aria-label="{{ ui.profiles }}">
      <a href="mailto:24101209@seoultech.ac.kr">{{ ui.email }}</a>
      <a href="https://www.linkedin.com/in/yeonohpark/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
    <nav class="language-switch" aria-label="{{ ui.language }}">
      <a href="{{ korean_url | relative_url }}" lang="ko" hreflang="ko" aria-label="한국어"{% if page_language == 'ko' %} aria-current="true"{% endif %}>KO</a>
      <span aria-hidden="true">/</span>
      <a href="{{ english_url | relative_url }}" lang="en" hreflang="en" aria-label="English"{% if page_language == 'en' %} aria-current="true"{% endif %}>EN</a>
    </nav>
  </div>
</aside>
